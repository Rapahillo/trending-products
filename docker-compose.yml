services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trending
      POSTGRES_PASSWORD: trending_dev
      POSTGRES_DB: trending
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
